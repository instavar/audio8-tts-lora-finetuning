name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q audio8_tts_data.py audio8_tts_infer.py audio8_tts_prepare.py audio8_tts_sft.py tests
      - run: python -m unittest discover -s tests -v
      - run: bash -n audio8_tts_lora.sh audio8_tts_sft.sh
