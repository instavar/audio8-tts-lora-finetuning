name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out pinned evaluation contract
        uses: actions/checkout@v5
        with:
          repository: instavar/instavar-voice-evaluation
          ref: 6fa431f6ab6bb9867a5fc210a187523012323ecb
          path: .instavar-voice-evaluation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m compileall -q audio8_tts_data.py audio8_tts_infer.py audio8_tts_prepare.py audio8_tts_sft.py tests
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .instavar-voice-evaluation
      - run: bash -n audio8_tts_lora.sh audio8_tts_sft.sh
